[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fastaframes"
authors = [
    {name = "Patrick Garrett", email = "pgarrett@scripps.edu"},
]
description = "Read FASTA files into pandas DataFrames and write them back, using fastatacular."
readme = "README.md"
requires-python = ">=3.12"
dynamic = ["version"]
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
dependencies = [
    "fastatacular>=1.3,<2",
    "pandas>=2.1",
]
keywords = [
    "FASTA",
    "UniProt",
    "pandas",
    "DataFrame",
    "proteomics",
    "bioinformatics",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
    "ty>=0.0.1a7",
]

[project.urls]
Homepage = "https://github.com/pgarrett-scripps/FastaFrames"
Repository = "https://github.com/pgarrett-scripps/FastaFrames"
Issues = "https://github.com/pgarrett-scripps/FastaFrames/issues"
Changelog = "https://github.com/pgarrett-scripps/FastaFrames/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/fastaframes/__init__.py"

[tool.hatch.build.targets.sdist]
# Source, tests and paperwork only: no app, examples, lockfile or repo tooling.
only-include = [
    "src/fastaframes",
    "tests",
    "README.md",
    "CHANGELOG.md",
    "CITATION.cff",
    "LICENSE",
    "pyproject.toml",
]

[tool.hatch.build.targets.wheel]
packages = ["src/fastaframes"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "SIM",   # flake8-simplify
    "TCH",   # flake8-type-checking
    "RUF",   # ruff-specific rules
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["fastaframes"]

[tool.ty.environment]
python-version = "3.12"
