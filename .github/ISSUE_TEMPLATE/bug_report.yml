name: Bug report
description: Something produces a wrong result, raises an unexpected error, or drops data.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting this. The fields below are what we need to reproduce
        the problem. A report without a runnable reproducer usually cannot be acted on.
  - type: textarea
    id: reproducer
    attributes:
      label: Minimal reproducer
      description: The smallest piece of code that shows the problem, as text we can copy and run.
      render: python
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened
      description: The output or the full traceback, as text rather than a screenshot.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
      description: If the expected value comes from the UniProt FASTA header specification, say so.
    validations:
      required: true
  - type: textarea
    id: headers
    attributes:
      label: The FASTA header or headers it happens on
      description: Paste the headers themselves, not a description of them. Whitespace and punctuation matter here.
      render: text
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: FastaFrames version
      description: "The version you have installed. `pip show fastaframes` or `uv pip show fastaframes` prints it."
      placeholder: "2.0.0"
    validations:
      required: true
  - type: input
    id: deps
    attributes:
      label: fastatacular and pandas versions
      description: "FastaFrames does all of its parsing through fastatacular, so both versions matter. `pip show fastatacular pandas` prints them."
      placeholder: "fastatacular 1.4.1, pandas 2.2.3"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Python version and operating system
      placeholder: "Python 3.12.4, Ubuntu 24.04"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How did you install it
      options:
        - pip
        - uv
        - conda or mamba
        - from source
        - other
    validations:
      required: true
